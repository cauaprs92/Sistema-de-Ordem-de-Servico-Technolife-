services:
  postgres:
    image: postgres:16
    container_name: technolife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: technolife
      POSTGRES_PASSWORD: technolife
      POSTGRES_DB: technolife
    ports:
      - "5432:5432"
    volumes:
      - technolife-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technolife"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: technolife-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - technolife-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  technolife-postgres-data:
  technolife-redis-data:
