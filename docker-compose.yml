services:
  postgres:
    image: postgres:16
    container_name: technoloife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: technoloife
      POSTGRES_PASSWORD: technoloife
      POSTGRES_DB: technoloife
    ports:
      - "5432:5432"
    volumes:
      - technoloife-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technoloife"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: technoloife-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - technoloife-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  technoloife-postgres-data:
  technoloife-redis-data:
